name: dfs_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  fl_chart: ^0.69.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  country_flags: ^2.2.0
  shared_preferences: ^2.3.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.1
  file_saver: ^0.2.12
  pdf: ^3.11.0
  printing: ^5.12.0
  image: ^4.2.0
  image_cropper: ^8.0.1
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.6.18
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dfs_complaint_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/dfs_complaint_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/dfs_complaint_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0A4FA3"
  windows:
    generate: false
  macos:
    generate: false

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/dfs_logo.png
    - assets/dfs_logo.png
    - assets/dfs_logo.svg
    - assets/data/dfs_products.csv
  generate: true

flutter_intl:
  enabled: true

