name: dfs_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^10.3.3
  country_flags: ^2.2.0
  shared_preferences: ^2.3.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dfs_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/dfs_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/dfs_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#0A4FA3"
  windows:
    generate: false
  macos:
    generate: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/dfs_logo.png
    - assets/dfs_logo.png
    - assets/dfs_logo.svg
  generate: true

flutter_intl:
  enabled: true



