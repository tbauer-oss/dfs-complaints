name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: dfs_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sanity check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Flutter doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      - name: Bump intl to 0.20.2 (match flutter_localizations)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub add intl:^0.20.2
          flutter pub upgrade --major-versions

      - name: Pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate l10n
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter gen-l10n

      - name: Verify l10n output exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -f lib/l10n/app_localizations.dart || (echo "l10n output missing" && exit 1)

      - name: Write google-services.json
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
        working-directory: dfs_mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
