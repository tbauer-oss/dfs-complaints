name: Android APK - DFS Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: dfs_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sanity check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -d android

      - name: Flutter doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      # google-services.json aus Secret schreiben (OK)
      - name: Write google-services.json
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          test -f android/app/google-services.json

      # Wichtig: Kein pub add / kein upgrade im CI
      - name: Pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # L10n nur generieren, ohne harte Dateiprüfung auf einen spezifischen Pfad
      - name: Generate l10n
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter gen-l10n

      - name: Write keystore + key.properties (HARD CHECK)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "PWD:"; pwd
          echo "Tree android before:"; ls -la android || true
          echo "Tree android/app before:"; ls -la android/app || true

          mkdir -p android/app

          # Keystore schreiben
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/***-release.jks

          # Harte Prüfungen
          test -f android/app/***-release.jks
          test -s android/app/***-release.jks  # Datei darf nicht 0 bytes sein

          # key.properties (relativ zu android/app/build.gradle.kts -> file() ist relativ zu android/app)
          cat > android/key.properties <<EOF
          storeFile=***-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          EOF

          echo "---- android/key.properties ----"
          cat android/key.properties
          echo "---- ls -la android/app ----"
          ls -la android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -la android/app
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFS-CP-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
