name: Android APK - DFS Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: dfs_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sanity check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -d android

      - name: Flutter doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      # google-services.json aus Secret schreiben (OK)
      - name: Write google-services.json
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          test -f android/app/google-services.json

      # Wichtig: Kein pub add / kein upgrade im CI
      - name: Pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # L10n nur generieren, ohne harte Dateiprüfung auf einen spezifischen Pfad
      - name: Generate l10n
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter gen-l10n

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFS-CP-debug
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
