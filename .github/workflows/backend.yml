name: Backend (Vercel API) – Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/backend.yml'
  workflow_dispatch: {}

jobs:
  deploy_vercel_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vercel CLI
        run: npm i -g vercel@latest

      # Backend-Projekt (dfs-complaints) verlinken
      - name: Vercel pull (link BE project)
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.BACKEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BACKEND_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Show vercel.json raw bytes
        run: hexdump -C vercel.json | head -n 1

      - name: Verify vercel.json encoding
        run: |
          file vercel.json
          hexdump -C vercel.json | head -n 1

      - name: Show link + config actually used
        run: |
          echo "---- CWD ----"; pwd
          echo "---- .vercel/project.json ----"
          cat .vercel/project.json || echo "no .vercel/project.json"
          echo "---- vercel.json (root) ----"
          [ -f vercel.json ] && (wc -c vercel.json; xxd -g 1 -l 16 vercel.json; cat vercel.json) || echo "no vercel.json"
          echo "---- any other vercel.json ----"
          find . -name vercel.json -not -path "./vercel.json" -maxdepth 3 -print || true

      - name: Deploy backend (with DEBUG)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN" --debug
