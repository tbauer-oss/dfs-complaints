name: Frontend (Flutter Web) – Build & Deploy

on:
 # push:
 #   branches: [ main ]
    paths:
      - 'flutter_web/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL'
        required: false
        default: 'https://dfs-complaints-backend.vercel.app'

jobs:
  build_flutter_web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable web & ensure project
        run: |
          flutter config --enable-web
          if [ ! -d "web" ]; then flutter create . --platforms=web; fi

      - name: Ensure intl 0.19.0
        run: flutter pub add intl:^0.19.0

      - name: Pub get
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Verify l10n output exists
        run: test -f lib/l10n/app_localizations.dart || (echo "l10n output missing" && exit 1)

      - name: Build Web (Prod API)
        env:
          API_BASE: ${{ github.event_name == 'workflow_dispatch'
                        && github.event.inputs.api_base != '' 
                        && github.event.inputs.api_base 
                        || vars.API_BASE || 'https://dfs-complaints-backend.vercel.app' }}
        run: |
          echo "Using API_BASE=${API_BASE}"
          flutter build web --release --web-renderer canvaskit --dart-define=API_BASE=${API_BASE}

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: flutter_web/build/web

  deploy_vercel_frontend:
    runs-on: ubuntu-latest
    needs: build_flutter_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: web_dist

      - name: Setup Vercel CLI
        run: npm i -g vercel@latest

      # Minimale Config für statisches Hosting – überschreibt Root-vercel.json
      - name: Create minimal vercel.json for static deploy
        run: printf "{}" > web_dist/vercel.json

      # Alles entfernen, was Functions/Builds triggern könnte
      - name: Sanitize upload
        run: |
          rm -rf web_dist/api || true
          rm -f  web_dist/package.json || true

      # FE-Projekt verlinken
      - name: Vercel pull (link FE project)
        env:
          VERCEL_TOKEN:     ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:    ${{ secrets.FRONTEND_ORG_ID }}
          VERCEL_PROJECT_ID:    ${{ secrets.FRONTEND_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Link-Datei ins Build
      - name: Propagate .vercel link into web_dist
        run: |
          mkdir -p web_dist/.vercel
          cp .vercel/project.json web_dist/.vercel/project.json

      - name: Deploy Static Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --cwd web_dist --local-config web_dist/vercel.json --prod --yes --token="$VERCEL_TOKEN"
