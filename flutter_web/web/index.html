<script>
  (function () {
    let deferredPrompt = null;
    window.__pwaCanInstall = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.__pwaCanInstall = true;
      window.dispatchEvent(new Event('pwa-can-install'));
      console.log('PWA install prompt captured.');
    });

    // Von Flutter/Dart aufrufbar:
    window.showInstallPrompt = async function () {
      if (!deferredPrompt) return false;
      const dp = deferredPrompt;
      deferredPrompt = null;
      window.__pwaCanInstall = false;
      const choice = await dp.prompt();
      console.log('PWA prompt outcome:', choice && choice.outcome);
      return choice && choice.outcome === 'accepted';
    };
  })();
</script>
