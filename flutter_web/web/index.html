<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <!-- Titel für Tab -->
    <title>DFS Complaints</title>

    <!-- Favicon & App-Icons -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DFS CP" />

    <!-- Manifest (mit Version, um Caches sicher zu brechen) -->
    <link rel="manifest" href="/manifest.json?v=7">

    <!-- PWA/Theme -->
    <meta name="application-name" content="DFS Complaints">
    <meta name="theme-color" content="#1976d2">

    <!-- iOS-spezifisch -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DFS Complaints">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- ROOT-Deployment -->
    <base href="/" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Optional: stabiler Renderer (html|canvaskit). Bei Problemen auf Handy oft "html" robuster -->
    <!-- <meta name="flutter-web-renderer" content="html"> -->
  </head>
  <body>
    <!-- Flutter Loader -->
    <script defer src="flutter.js"></script>

    <!-- Sichtbares Fehler-Logging, falls mal etwas schief geht (hilft gegen "weißen Screen") -->
    <script>
      window.addEventListener('error', (e) => {
        console.error('WindowError:', e.message, e.error);
      });
      window.addEventListener('unhandledrejection', (e) => {
        console.error('UnhandledRejection:', e.reason);
      });
    </script>

    <script>
      window.addEventListener('load', function () {
        // Flutter setzt diese Variable beim Build ein; Fallback sorgt dafür, dass Clients updaten
        const swVersionTemplate = (typeof {{flutter_service_worker_version}} !== 'undefined')
          ? {{flutter_service_worker_version}}
          : null;
        const serviceWorkerVersion = swVersionTemplate || String(Date.now());

        // Verschiedene Loader-Namen je nach Flutter-Version
        const loader =
          (window.flutterLoader && typeof window.flutterLoader.load === 'function')
            ? window.flutterLoader
            : (window._flutter && window._flutter.loader)
              ? window._flutter.loader
              : null;

        if (!loader) {
          console.error('Flutter loader not found – check that <script src="flutter.js" defer> is present and loads before this block.');
          return;
        }

        // Bevorzugt moderne API, sonst Fallback auf alte
        const loadFn = loader.load ?? loader.loadEntrypoint;

        // --- DEBUG: Service Worker temporär deaktivieren (bei SW-Problemen) ---
        // const swConfig = undefined; // <-- zum Testen SW aus
        // ----------------------------------------------------------------------

        const swConfig = { serviceWorkerVersion: serviceWorkerVersion };

        loadFn({
          serviceWorker: swConfig,
          onEntrypointLoaded: (engineInitializer) => {
            engineInitializer.initializeEngine()
              .then((appRunner) => appRunner.runApp())
              .catch((e) => {
                console.error('initializeEngine failed:', e);
              });
          }
        });
      });
    </script>
  </body>
</html>
