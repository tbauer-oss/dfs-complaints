<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <title>DFS Complaints</title>

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DFS CP" />
    <link rel="manifest" href="/manifest.json?v=7" />

    <!-- PWA / Theme -->
    <meta name="application-name" content="DFS Complaints" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DFS Complaints" />

    <!-- Routing -->
    <base href="/" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Optional: falls Handy zickt, Renderer auf 'html' setzen -->
    <!-- <meta name="flutter-web-renderer" content="html" /> -->
  </head>
  <body>
    <!-- Flutter Runtime -->
    <script defer src="flutter.js"></script>

    <!-- Diese Variable lässt Flutter beim Build ggf. ersetzen; null ist ok -->
    <script>
      var serviceWorkerVersion = null;
    </script>

    <!-- Minimaler, robuster Loader (neuere API mit Fallback) -->
    <script>
      window.addEventListener('load', function () {
        var loader =
          (window._flutter && window._flutter.loader) ||
          window.flutterLoader ||
          null;

        if (!loader) {
          console.error('Flutter loader not found. Prüfe <script defer src="flutter.js">.');
          return;
        }

        var loadFn = loader.load || loader.loadEntrypoint;

        loadFn({
          serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            }).catch(function (e) {
              console.error('initializeEngine failed:', e);
            });
          }
        });
      });
    </script>
  </body>
</html>
