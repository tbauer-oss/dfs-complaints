<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- Routing-Basis für alle relativen Pfade -->
    <base href="/" />

    <title>DFS Complaints</title>

    <!-- PWA: Manifest & Icons -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Farben / iOS-Standalone -->
    <meta name="theme-color" content="#1F4C8F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Optional: Renderer (nur falls einzelne Geräte Probleme machen) -->
    <!-- <meta name="flutter-web-renderer" content="html" /> -->

    <!-- Flutter Runtime (wird vom Flutter-Build bereitgestellt) -->
    <script src="flutter.js" defer></script>
  </head>
  <body>
    <noscript>
      Bitte JavaScript aktivieren, um die Anwendung zu starten.
    </noscript>

    <!-- Muss existieren; wird vom Flutter-Service-Worker verwendet -->
    <script>
      /* eslint-disable no-var */
      var serviceWorkerVersion = null;
    </script>

    <!-- ES5: Install-Prompt Hook (beforeinstallprompt) -->
    <script>
      (function () {
        /* eslint-disable no-var */
        var deferredPrompt = null;
        window.__pwaCanInstall = false;

        if (window && window.addEventListener) {
          window.addEventListener('beforeinstallprompt', function (e) {
            try { if (e && e.preventDefault) e.preventDefault(); } catch (_) {}
            deferredPrompt = e;
            window.__pwaCanInstall = true;

            // 'pwa-can-install' an App signalisieren
            try {
              var ev;
              if (typeof CustomEvent === 'function') {
                ev = new CustomEvent('pwa-can-install');
              } else {
                ev = document.createEvent('Event');
                ev.initEvent('pwa-can-install', true, true);
              }
              window.dispatchEvent(ev);
            } catch (_) {}

            try { if (window.console && console.log) console.log('PWA install prompt captured.'); } catch (_) {}
          });
        }

        // Von Flutter/Dart aufrufbar: window.showInstallPrompt()
        window.showInstallPrompt = function () {
          return new Promise(function (resolve) {
            if (!deferredPrompt || !deferredPrompt.prompt) return resolve(false);

            var dp = deferredPrompt;
            deferredPrompt = null;
            window.__pwaCanInstall = false;

            try {
              var p = dp.prompt();
              if (p && typeof p.then === 'function') {
                p.then(function (choice) {
                  var ok = choice && choice.outcome === 'accepted';
                  try { if (window.console && console.log) console.log('PWA prompt outcome:', choice && choice.outcome); } catch (_) {}
                  resolve(!!ok);
                }).catch(function () { resolve(false); });
              } else {
                resolve(true); // sehr alte Browser: einfach true melden
              }
            } catch (e) {
              resolve(false);
            }
          });
        };
      })();
    </script>

    <!-- ES5: ?install=1 Handler + iFrame-Breakout + 'pwa-show-cta' -->
    <script>
      (function () {
        function wantsInstall() {
          try { return /\binstall=1\b/i.test(window.location.search); } catch (_) { return false; }
        }
        function ensureTopLevel() {
          try {
            if (window.top !== window.self) {
              // In iFrames sind Install-Prompts blockiert → Top-Level öffnen
              window.top.location = window.location.href;
            }
          } catch (_) {}
        }

        // Sobald die App installierbar ist, optional CTA anzeigen lassen
        window.addEventListener('pwa-can-install', function () {
          if (wantsInstall()) {
            try {
              var ev;
              if (typeof CustomEvent === 'function') {
                ev = new CustomEvent('pwa-show-cta');
              } else {
                ev = document.createEvent('Event');
                ev.initEvent('pwa-show-cta', true, true);
              }
              window.dispatchEvent(ev);
            } catch (_) {}
          }
        });

        // direkt beim Laden sicherstellen, dass wir Top-Level sind
        ensureTopLevel();
      })();
    </script>

    <!-- Stabiler Flutter-Loader (vermeidet Whitescreens) -->
    <script>
      window.addEventListener('load', function () {
        if ('serviceWorker' in navigator) {
          window.flutterConfiguration = {
            serviceWorker: { serviceWorkerVersion: serviceWorkerVersion }
          };
        } else {
          window.flutterConfiguration = {};
        }

        window.flutterConfiguration.onEntrypointLoaded = function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          }).catch(function (e) {
            try { console.error('initializeEngine failed:', e); } catch (_) {}
          });
        };

        // Legacy-Loader der stabil mit flutter.js zusammenspielt
        _flutter.loader.loadEntrypoint(window.flutterConfiguration);
      });
    </script>
  </body>
</html>
