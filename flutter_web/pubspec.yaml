name: dfs_customer_complaint
description: DFS Customer Complaint Web App
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^10.3.3
  country_flags: ^2.2.0
  fl_chart: ^0.69.0

flutter:
  uses-material-design: true
  assets:
    - assets/dfs_logo.png
    - assets/dfs_logo.svg
  generate: true

flutter_intl:
  enabled: true
